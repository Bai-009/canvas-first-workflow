<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会话栏状态检查</title>
<style>:root{--paper:#fff;--canvas:#eef0f3;--surface:#f4f5f7;--line:#e4e6ea;--ink:#1a1d22;--ink-2:#545b65;--ink-3:#8f96a0;--accent:#2f6fed;--nc-error:#a13b32;--font:Inter,"PingFang SC",sans-serif}*{box-sizing:border-box}html,body{margin:0;overflow-x:clip;font-family:var(--font);background:var(--canvas)}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:24px;padding:24px}.sample{min-width:0}h2{font-size:12px;font-weight:500;color:var(--ink-2)}.sample .sessions{position:relative;inset:auto;width:100%;min-height:140px;box-shadow:none}.session-row.is-focus{outline:2px solid var(--accent);outline-offset:2px}</style><link rel="stylesheet" href="./sessions.css"><main id="samples"></main>
<script>
const states=['default','hover','focus','active','disabled','loading','error','success'];
for(const state of states){const block=document.createElement('section');block.className='sample';block.innerHTML=`<h2>${state}</h2><aside class="sessions" data-state="${state}" ${state==='loading'?'aria-busy="true"':''}><div class="session-heading"><p class="session-label">工作流</p><button class="session-new" aria-label="新工作流" ${state==='disabled'?'disabled':''}><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 4.5v11M4.5 10h11"/></svg></button></div><div class="session-row ${['hover','focus','active'].includes(state)?'is-'+state:''}" ${state==='success'?'data-current="true"':''}><a class="session-link" href="#"><span>合同金额工作流</span>${state==='loading'?'<i class="session-working" aria-label="正在处理"></i>':''}</a></div>${state==='error'?'<p class="session-error">保存失败，请重试</p>':''}${state==='success'?'<span class="session-save">已保存到本机</span>':''}</aside>`;document.getElementById('samples').append(block);}
</script></html>
