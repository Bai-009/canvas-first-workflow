<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>画布</title>
<script src="./theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600&display=swap">
<link rel="stylesheet" href="./node-conversation.css">
<style>
  :root {
    --paper:#fff; --canvas:#eef0f3; --surface:#f4f5f7; --line:#e4e6ea;
    --ink:#1a1d22; --ink-2:#545b65; --ink-3:#8f96a0;
    --font:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Monaco,Consolas,monospace;
    --tile:176px;
    --spring:cubic-bezier(.22,1.28,.32,1);
    --ease-out:cubic-bezier(.16,1,.3,1);
    --accent:#2f6fed;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--canvas);color:var(--ink);
    font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

  .viewport{position:absolute;inset:0;cursor:grab}
  .viewport.grabbing{cursor:grabbing}
  .world{position:absolute;top:0;left:0;transform-origin:0 0}
  .world.gliding{transition:transform 520ms cubic-bezier(.25,1,.3,1)}

  /* 线是结构不是内容,报不出判断,所以零强调:中性灰、单一粗细。
     一条线三样:出发点一个小圆点、一段贝塞尔、末端一个描边的箭头。 */
  .wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  .wire{fill:none;stroke:#aeb5c0;stroke-width:2.6;stroke-linecap:round}
  .tip{fill:none;stroke:#aeb5c0;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .port{fill:#aeb5c0}
  /* 线自己走一遍再接上卡片:箭头等线走到了才出现。
     出发点那个圆点是上游卡片的出口,线没走它也在。 */
  .edge .tip,.edge .wire-label{transition:opacity 240ms ease}
  .edge.held .tip,.edge.held .wire-label{opacity:0}
  /* 线上那行字压在线上,底下垫一圈画布色,字不跟线搅在一起。 */
  .wire-label{font-family:var(--font);font-size:11px;font-weight:500;fill:var(--ink-3);
    paint-order:stroke;stroke:var(--canvas);stroke-width:4px;stroke-linejoin:round}

  /* 进度长在链路自己的轨道上:头上那个点是下一张卡出现的地方,
     右边一条淡线带着几个点,是还没走到的几步。除此之外画布上不加东西。 */
  /* 轨道跟真线同一个分量(2.6),不是一根更细的东西——它是同一条链还没长出来的那一截。
     描边用渐变,末端淡掉:链路到这儿没有结束,只是还没长出来。 */
  .track{fill:none;stroke:url(#trackFade);stroke-width:2.6;stroke-linecap:round}
  .track-dot{fill:#c3c9d3}
  .track-head{fill:var(--accent);animation:headPulse 1.6s ease-in-out infinite}
  @keyframes headPulse{0%,100%{opacity:.34;r:5}50%{opacity:1;r:7}}
  .wire.waiting{stroke:#d7dbe2;stroke-dasharray:5 7;animation:wireFlow 1.1s linear infinite}
  @keyframes wireFlow{to{stroke-dashoffset:-24}}
  /* 停住的那一步:长在它本该出现的那一格上。是一张卡,但一眼看得出不是建好的卡——
     只有一圈描边,没有影子;哪一步、为什么、能做什么,都在同一个地方。 */
  .stop{position:absolute;width:300px;transform:translate(0,-50%);padding:14px 16px 13px;
    border-radius:18px;background:var(--paper);box-shadow:0 0 0 1px var(--line);cursor:pointer;
    transition:width 420ms var(--spring),padding 420ms var(--spring),border-radius 420ms var(--spring)}
  /* 点开:跟一张卡撑开是同一个尺寸(540 / 22 / 18),原因不再截,三个选择都在。 */
  .stop.open{width:540px;border-radius:22px;padding:18px;cursor:default;z-index:20;
    box-shadow:0 22px 40px -18px rgba(20,26,38,.34),0 6px 14px -4px rgba(20,26,38,.10),0 0 0 1px var(--line)}
  .stop[hidden]{display:none}
  .stop-top{display:flex;align-items:center;gap:9px}
  .stop-mark{flex:0 0 auto;width:9px;height:9px;border-radius:50%;border:2px solid #c0c6d0}
  .stop-name{margin:0;font-size:14px;font-weight:550;line-height:20px;color:var(--ink)}
  /* 原因一条一行。收着的时候只给四行,点开看全——卡就是这么用的。 */
  .stop-why{margin:8px 0 0;font-size:12.5px;line-height:19px;color:var(--ink-3);white-space:pre-line;
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .stop.open .stop-why{display:block;-webkit-line-clamp:unset;overflow:visible;color:var(--ink-2)}
  .stop-why[hidden]{display:none}
  .stop-acts{display:flex;gap:8px;margin-top:12px}
  .stop-acts button{border:0;border-radius:9px;padding:6px 13px;font:inherit;font-size:12.5px;cursor:pointer;
    transition:background 160ms ease,color 160ms ease}
  .stop-again{background:var(--accent);color:#fff}
  .stop-again:hover{background:#2458c7}
  .stop-talk,.stop-plan{background:rgba(20,26,38,.05);color:var(--ink)}
  .stop-talk:hover,.stop-plan:hover{background:rgba(20,26,38,.09)}
  .stop:not(.open) .stop-talk,.stop:not(.open) .stop-plan{display:none}
  /* 一行字,一行到底:再长也不许在画布上摊开成一段文章。 */
  .track-label{position:absolute;transform-origin:50% 0;white-space:nowrap;max-width:320px;
    overflow:hidden;text-overflow:ellipsis;
    font-size:13px;line-height:20px;color:var(--ink-2);pointer-events:none}
  .track-label[hidden]{display:none}
  /* 换行的那一版必须写死宽度,不能只写 max-width:.world 没有宽度,
     绝对定位的孩子拿到的可用宽是 0,于是每个字换一行。 */


  .node{position:absolute;width:var(--tile);height:var(--tile)}
  /* 高度写死成一格,不写 auto:从 auto 起步的高度动画浏览器不认,展开会是硬跳。
     撑开的过程要裁边,不然内容会先漏在框外面。 */
  .card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:var(--tile);height:var(--tile);overflow:hidden;
    border-radius:24px;background:var(--paper);cursor:pointer;
    transition:width 420ms var(--spring),border-radius 420ms var(--spring),box-shadow 300ms ease;
    box-shadow:0 18px 34px -18px rgba(20,26,38,.30),0 4px 10px -4px rgba(20,26,38,.08),0 0 0 1px rgba(20,26,38,.05)}
  .card:hover{box-shadow:0 22px 40px -18px rgba(20,26,38,.34),0 6px 14px -4px rgba(20,26,38,.10),
    0 0 0 1px rgba(20,26,38,.07)}
  .node.open{z-index:20}
  .node.open .card{width:540px;border-radius:22px;
    box-shadow:0 40px 80px -24px rgba(20,26,38,.32),0 12px 24px -8px rgba(20,26,38,.10),
      0 0 0 1px rgba(20,26,38,.06),0 0 0 4px color-mix(in srgb,var(--c) 12%,transparent)}
  /* 撑开:宽、高、位移必须同一条时长同一条曲线。位移是照着高度算出来的
     （卡片钉住上沿往下长）,两条跑得不一样快,上沿就会飘。 */
  .node.morph .card{transition:width 620ms var(--spring),height 620ms var(--spring),
    transform 620ms var(--spring),border-radius 620ms var(--spring),box-shadow 320ms ease}
  /* 退到背景里的那几张只改透明度:聚焦的时候别的卡不许再跟着缩一下。 */
  .node.dim .card{opacity:.32;box-shadow:0 1px 2px rgba(20,26,38,.04),0 0 0 1px rgba(20,26,38,.04)}
  /* 量高度的那一帧不许有过渡,量完就恢复。 */
  .node.measuring,.node.measuring *{transition:none !important}

  .icon{width:30px;height:30px;flex:0 0 auto;display:grid;place-items:center;border-radius:9px;
    background:color-mix(in srgb,var(--c) 13%,#fff);color:var(--c)}
  .icon svg{width:17px;height:17px}

  /* 收起 */
  .card-mini{position:absolute;inset:0;opacity:1;transition:opacity 220ms ease 300ms}
  .mini{padding:17px;display:flex;flex-direction:column;height:var(--tile)}
  .node.open .card-mini{opacity:0;pointer-events:none;transition:opacity 140ms ease}
  .mini-top{display:flex;align-items:center;gap:9px}
  .mini-kind{flex:1;min-width:0;color:var(--c);font-size:11.5px;font-weight:500;line-height:15px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mark{flex:0 0 auto;color:var(--ink-3);font-size:12px;line-height:15px}
  .dot-c{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c)}
  .mini-fill{flex:1}
  .mini-name{margin:0;font-size:14.5px;font-weight:550;line-height:20px;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .mini-evi{margin:4px 0 0;height:16px;font-size:11.5px;line-height:16px;color:var(--ink-3)}
  .mini-evi.pending{color:var(--c)}

  /* 展开 */
  /* 正文始终按展开宽度排版；外壳舒展时只揭示内容，不让文字逐帧重排。 */
  .card-detail{width:540px;height:100%;padding:18px;display:flex;flex-direction:column;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity 140ms ease,visibility 0s linear 140ms}
  .node.open .card-detail{opacity:1;visibility:visible;pointer-events:auto;
    transition:opacity 260ms ease 60ms,visibility 0s}
  .card-header{flex:0 0 auto;padding-bottom:14px}
  .node .node-conversation{display:block;flex:0 0 auto}
  .node.open .card{max-height:var(--node-room-height,calc(100vh - 180px));overflow:hidden}
  .card-content{flex:1 1 auto;min-height:0;min-width:0;padding-right:8px;overflow-x:hidden;overflow-y:auto;
    overflow-wrap:anywhere;scrollbar-width:thin;scrollbar-gutter:stable;scrollbar-color:rgba(83,92,108,.18) transparent;overscroll-behavior:contain;
    mask-image:linear-gradient(to bottom,transparent,var(--ink) var(--node-fade-top,0px),var(--ink) calc(100% - var(--node-fade-bottom,0px)),transparent)}
  .card-content:hover,.card-content:focus-within{scrollbar-color:rgba(83,92,108,.32) transparent}
  .card-content::-webkit-scrollbar{width:4px;height:0}
  .card-content::-webkit-scrollbar-track{background:transparent}
  .card-content::-webkit-scrollbar-thumb{border-radius:4px;background:rgba(83,92,108,.18)}
  .card-content:hover::-webkit-scrollbar-thumb{background:rgba(83,92,108,.32)}
  /* 保留滚动能力和轨道宽度，只在外壳动画期间隐藏不断变长的滑块。 */
  .node .card.resizing .card-content{scrollbar-color:transparent transparent}
  .node .card.resizing .card-content::-webkit-scrollbar-thumb{background:transparent}
  .node-inspect{display:block}
  .node.open .full-top{margin-bottom:0}
  .node.measuring{opacity:0;pointer-events:none}
  .node.measuring .card-detail{height:auto;max-height:var(--node-room-height)}
  @media(prefers-reduced-motion:reduce){
    .world.gliding,.node.morph .card,.card-mini,.node.open .card-mini,.card-detail,.node.open .card-detail{transition:none}
  }
  .mini-evi.revision-evi{color:var(--ink-2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .node [data-key]:disabled{cursor:not-allowed;opacity:.55}
  .bar-status{min-height:17px;margin:5px 10px 0;font-size:11px;line-height:17px;color:var(--ink-2)}
  .bar-status:empty{display:none}
  .plan-problems{margin:9px 0 0;padding-top:9px;border-top:1px solid var(--line);font-size:11.5px;line-height:18px;color:var(--nc-error);white-space:pre-line;max-height:112px;overflow-y:auto;scrollbar-width:thin}
  .plan-problems[hidden]{display:none}
  .plan-dot.has-problems.done::before{content:"!";color:var(--nc-error)}
  .full-top{display:flex;align-items:center;gap:11px;margin-bottom:12px}
  .full-name{margin:0;flex:1;font-size:15px;font-weight:550;line-height:22px}
  .full-kind{flex:0 0 auto;color:var(--c);font-size:11.5px;font-weight:600;letter-spacing:.02em}
  .note{margin:0 0 12px;font-size:13px;line-height:19px;color:var(--ink-2)}
  .fields{padding:6px 15px;border-radius:12px;background:var(--surface)}
  .field{display:flex;align-items:center;gap:14px;min-height:40px;font-size:13.5px}
  .field + .field{border-top:1px solid #eceef1}
  .lbl{flex:0 0 118px;color:var(--ink-3);font-size:12.5px;font-weight:500;letter-spacing:.01em}
  /* 空位是入口,填好的值也是入口——两种都是「这一格怎么定的」。
     只让空的点得开,等于戏做了一半。 */
  .slot,.set{font:inherit;cursor:pointer;text-align:left;border:0;padding:3px 10px;border-radius:7px;
    transition:background 140ms ease,box-shadow 140ms ease}
  .slot{display:inline-flex;align-items:center;gap:6px;
    background:color-mix(in srgb,var(--c) 11%,transparent);color:color-mix(in srgb,var(--c) 88%,#2b3038)}
  .slot:hover{background:color-mix(in srgb,var(--c) 18%,transparent)}
  .slot svg{width:13px;height:13px;flex:0 0 auto}
  .set{background:none;margin:-3px -10px}
  .set:hover{background:rgba(20,26,38,.05);box-shadow:0 0 0 1px rgba(20,26,38,.06)}
  .val{font-family:var(--mono);font-size:12.5px;color:var(--ink)}
  .txt{color:var(--ink)}
  .sec{margin:14px 0 6px;font-size:12.5px;color:var(--ink-3);font-weight:500;letter-spacing:.01em}
  .prompt{display:block;width:100%;text-align:left;border:0;margin:0;padding:12px 15px;border-radius:12px;
    background:var(--surface);cursor:pointer;
    font-family:var(--mono);font-size:12.5px;line-height:1.7;color:var(--ink-2);white-space:pre-wrap;
    overflow-wrap:anywhere;transition:box-shadow 140ms ease}
  .prompt:hover{box-shadow:0 0 0 1px rgba(20,26,38,.09)}
  .node-block{margin-top:16px}
  .node-block>summary{display:grid;grid-template-columns:1fr auto;gap:8px 12px;list-style:none;cursor:pointer;font-size:12px;color:var(--ink-2);padding:4px 0}
  .node-block>summary::-webkit-details-marker,.node-connections>summary::-webkit-details-marker{display:none}
  .node-disclosure-hint{font-size:11px;color:var(--ink-2)}
  .node-disclosure-hint::after{content:'›';display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-left:7px;font-size:14px;line-height:1;transition:transform 140ms ease}
  details[open]>summary .node-disclosure-hint::after{transform:rotate(90deg)}
  .node-preview{grid-column:1/-1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--mono);font-size:12px;line-height:20px;white-space:pre-wrap;padding:0 2px;color:var(--ink-2)}
  .node-block[open] .node-preview{display:none}
  .node-block[open]>summary{margin-bottom:6px}
  .node-block>summary:focus-visible,.node-connections>summary:focus-visible{outline:2px solid var(--nc-focus);outline-offset:2px;border-radius:4px}
  .node-connections{margin-top:16px}
  .node-connections>summary{display:flex;align-items:center;justify-content:space-between;min-height:36px;list-style:none;cursor:pointer;font-size:12px;color:var(--ink-2)}
  .node-connections .io{margin:0;padding:6px 0 12px;border:0}
  .io{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:grid;
    grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:11.5px;line-height:17px;color:var(--ink-3)}
  .io b{font-weight:500;color:var(--ink-3);letter-spacing:.02em}
  .io span{color:var(--ink-2)}
  .io .name{color:var(--ink);font-weight:550}

  /* 新长出来的卡:从左边一点点长出来,线是从左边来的。 */
  .node.born .card{opacity:0;transform:translate(calc(-50% - 26px),-50%) scale(.66)}
  .node .card{opacity:1;transition:width 420ms var(--spring),border-radius 420ms var(--spring),
    box-shadow 300ms ease,opacity 320ms ease,transform 520ms var(--spring)}
  .node{transition:left 420ms var(--spring),top 420ms var(--spring)}

  .stage{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform,opacity,filter}
  .stage.swap{transition:transform 620ms var(--ease-out),opacity 520ms ease,filter 520ms ease}
  /* 退的是深度,不是平面:工作流留在原位一个像素没挪,只是退到后面。 */
  .stage.recede{transform:scale(.955);opacity:.3;filter:blur(2px)}

  /* 顶栏:左边是自己是谁,右边是这一条上能做的事。通栏但不挡画布——
     整条不收指针,只有里面的东西收。需求框在它下面(top:68)。 */
  .top{position:fixed;left:0;right:0;top:0;z-index:60;height:56px;padding:0 24px;
    display:flex;align-items:center;justify-content:space-between;gap:20px;pointer-events:none}
  .top > *{pointer-events:auto}
  .logo{display:flex;align-items:center;gap:8px;color:var(--ink)}
  /* 标记是横向的形,不塞进方框里:高度定死,宽度随它自己的比例。 */
  .logo svg{display:block;height:13px;width:auto}
  .logo-t{font-size:14px;font-weight:450;letter-spacing:-.004em;color:var(--ink-2)}
  .logo-t b{font-weight:580;color:var(--ink)}
  /* 「新建」是「这一条不要了,重开」——跟方案卡没关系,不该挤在卡的页脚里。 */
  .fresh{border:0;background:none;padding:6px 10px;border-radius:9px;color:var(--ink-3);
    font:inherit;font-size:12.5px;cursor:pointer;transition:color 160ms ease,background 160ms ease}
  .fresh:hover{color:var(--ink);background:rgba(20,26,38,.05)}
  .fresh[hidden]{visibility:hidden}

  /* Plan 卡片:画布还空着的时候,注意力本来就该在中央。 */
  .plan{position:fixed;z-index:47;padding:18px 20px 16px;border-radius:16px;background:var(--paper);
    box-shadow:0 12px 32px -16px rgba(20,26,38,.26),0 0 0 1px rgba(20,26,38,.05)}
  .plan[hidden]{display:none}
  .plan-content{display:flow-root;min-width:0}
  .plan-motion-copy{position:absolute;pointer-events:none;user-select:none}
  .plan-motion-copy,.plan-motion-copy *{animation:none!important;transition:none!important}
  .plan-motion-copy .plan-body{overflow:hidden!important}
  .plan.mini{padding:13px 15px 12px;cursor:pointer}
  .plan.mini:hover{box-shadow:0 16px 40px -18px rgba(20,26,38,.32),0 0 0 1px rgba(20,26,38,.09)}
  /* 飞行只动位置、宽度、内边距和高度;高度显式写死,正文只跟着裁。 */
  .plan.morph{overflow:hidden;transition:left var(--mo,620ms) var(--ease-out),top var(--mo,620ms) var(--ease-out),
    width var(--mo,620ms) var(--ease-out),height var(--mo,620ms) var(--ease-out),padding var(--mo,620ms) var(--ease-out)}
  .plan-label{display:block;margin-bottom:4px;color:var(--ink-3);font-size:11px;font-weight:500}
  /* 需求是一句话,不是原稿。方案没出来之前这里先摆着用户自己敲的那一段——
     那一段可能有两千字,不封顶它会把整张卡顶出屏幕,页脚的「开始生成」就点不到了。
     全文没丢:它在下面的对话里。 */
  .plan-text{margin:0;color:var(--ink-2);font-size:13px;line-height:1.55;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

  .plan-body{overflow:hidden;max-height:0;opacity:0;
    transition:max-height var(--mo,620ms) var(--ease-out),opacity calc(var(--mo,620ms) * .55) ease,margin-top var(--mo,620ms) var(--ease-out)}
  /* 封顶留的是「屏幕减去卡片自己的头尾和底下那条输入框」,不是一个拍出来的 vh:
     窗口矮下去的时候 vh 跟着缩,但头尾和输入框不缩,卡片照样会压到输入框上。 */
  .plan.open .plan-body{max-height:calc(100vh - 320px);opacity:1;margin-top:12px;overflow-y:auto}

  .plan.morph .plan-body{overflow:hidden}
  .plan.morph .plan-foot{transition:margin-top var(--mo,620ms) var(--ease-out),padding-top var(--mo,620ms) var(--ease-out)}

  /* 滚条只说明「下面还有」,不该自己占一条 15 像素的灰槽。一套形,四处一样。 */
  .plan-body,.prompt,.grow > textarea{
    scrollbar-width:thin;scrollbar-color:rgba(20,26,38,.16) transparent}

  .drop{animation:planDrop 380ms var(--ease-out) both}
  @keyframes planDrop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  .plan-sec{padding-top:12px;border-top:1px solid var(--line)}
  .plan-sec + .plan-sec{margin-top:12px}
  .plan-sec[hidden]{display:none}
  .plan-h{margin:0 0 8px;color:var(--ink-3);font-size:11px;font-weight:500}

  /* 对话:一句一句留着,谁说的看形不看名——自己说的是一块浅底,
     Plan Agent 说的就是正文。这里不写「你」「它」,画面上没有人。 */
  .plan-chat{display:flex;flex-direction:column;gap:9px}
  /* 自己说的那条只留五行:一段长话摆在这儿,回话就被顶到看不见,
     而且线程要自己再开一个滚条——一张卡上两条滚条并排,难看。
     裁的是里面那层字,不是气泡本身:气泡有内边距,裁在气泡上会从底下漏出半行。 */
  .plan-turn.me{align-self:flex-end;max-width:84%;padding:6px 12px;border-radius:13px;
    background:var(--surface);color:var(--ink);font-size:12.5px;line-height:19px}
  .plan-turn.me > span{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;
    overflow:hidden;white-space:pre-line}
  .plan-says{font-size:12.5px;line-height:19px;color:var(--ink-2)}
  .plan-says p{margin:0 0 9px}
  .plan-says p:last-child{margin-bottom:0}
  .plan-says b{color:var(--ink);font-weight:550}
  .plan-says ul.says{margin:0 0 9px;padding:0;list-style:none}
  .plan-says ul.says li{position:relative;padding:2px 0 2px 13px}
  .plan-says ul.says li::before{content:"";position:absolute;left:2px;top:9px;width:4px;height:4px;
    border-radius:50%;background:var(--ink-3)}

  /* 原文和解读并排,一行一件事,才对照得起来。 */
  .plan-table{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
  .plan-table th{padding:0 0 6px;text-align:left;font-weight:500;color:var(--ink-3);font-size:11px;
    border-bottom:1px solid var(--line)}
  .plan-table th:first-child{width:34%;padding-right:14px}
  .plan-table td{padding:7px 0;vertical-align:top;color:var(--ink-2);line-height:19px;
    border-bottom:1px solid #f0f1f4}
  .plan-table td:first-child{padding-right:14px;color:var(--ink)}
  .plan-table tr:last-child td{border-bottom:0}
  .plan-hint{margin:10px 0 0;font-size:11.5px;line-height:17px;color:var(--ink-3)}
  /* 路线只说先后,不说数量和位置,所以是文字接文字,不是几个方框。 */
  .plan-route{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:12.5px;color:var(--ink)}
  .plan-route i{font-style:normal;color:var(--ink-3)}
  .plan-ask{display:flex;gap:9px;font-size:12.5px}
  .plan-ask + .plan-ask{margin-top:9px}
  .plan-ask .q{flex:0 0 auto;width:15px;height:15px;margin-top:1px;border-radius:50%;display:grid;
    place-items:center;font-size:10px;color:var(--paper);background:var(--accent)}
  .plan-ask b{display:block;font-weight:500;color:var(--ink)}
  .plan-ask span{color:var(--ink-3)}

  .plan-foot{display:flex;align-items:center;gap:9px;margin-top:13px;padding-top:11px;border-top:1px solid var(--line)}
  .plan.mini .plan-foot{margin-top:11px;padding-top:10px}
  .plan-dot{width:12px;height:12px;flex:0 0 auto;position:relative}
  .plan-dot::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--accent);
    animation:planPulse 1.1s ease-in-out infinite}
  .plan-dot.done::after{animation:none;background:none}
  .plan-dot.done::before{content:"✓";position:absolute;inset:0;font-size:12px;line-height:12px;color:var(--ink-3)}
  @keyframes planPulse{0%,100%{opacity:.35}50%{opacity:1}}
  .plan-say{flex:1;min-width:0;color:var(--ink-2);font-size:12.5px;overflow:hidden;
    white-space:nowrap;text-overflow:ellipsis}
  /* 开始是个动作,不是一句要打出来的话;它落在卡片底部状态行右侧。 */
  .plan-go{margin-left:auto;flex:0 0 auto;padding:6px 14px;border:0;border-radius:9px;background:var(--accent);
    color:#fff;font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;transition:filter 140ms ease}
  .plan-go:hover{filter:brightness(1.06)}
  .plan-go[hidden],.plan-close[hidden]{display:none}
  .plan-close{margin-left:auto;flex:0 0 auto;border:0;background:none;color:var(--ink-3);
    font:inherit;font-size:12px;cursor:pointer}
  .plan-close:hover{color:var(--ink)}

  /* 选择器:点那一格,画布往后退,它上台。跟需求框飞回中央是同一个动作,
     所以用的是同一套后退(stage.recede)。圆角按尺寸来:面板 26 / 行 16 / 内 10。 */
  .picker{position:fixed;inset:0;pointer-events:none;z-index:70}
  /* 上着的时候整块都收指针:点面板外面的任何一处都是「不选了」,
     不收的话那一下会穿过去落在画布上,把背后那张卡关掉,面板自己还杵着。 */
  .picker.on{pointer-events:auto}
  .picker[hidden]{display:none}
  /* 面板落在哪儿由 JS 定:它是这张卡的东西,就该落在这张卡的中轴上。
     居中在屏幕上是不对的——卡片被镜头摆在「屏幕减掉右边需求框」的中间,
     两个中心本来就错开;面板从卡上那一格长出来,却落在跟卡无关的地方,
     「我从那儿来」和「我属于这儿」就对不上。 */
  .panel{position:fixed;width:min(452px,calc(100vw - 40px));max-height:calc(100vh - 40px);
    overflow-y:auto;background:var(--paper);
    border-radius:26px;padding:20px 18px 16px;scrollbar-width:thin;scrollbar-color:rgba(20,26,38,.16) transparent;
    box-shadow:0 40px 80px -24px rgba(20,26,38,.32),0 12px 24px -8px rgba(20,26,38,.10),
      0 0 0 1px rgba(20,26,38,.06);
    opacity:0;transform:scale(.46);pointer-events:none;transform-origin:50% 50%;
    /* 退场单独写一条,不拿上台那条倒着放。上台用 spring(会冲过头再落回来,
       站住的那一下有劲);倒着放,冲过头发生在最后,退到一半又弹回来一点,
       像没退干净。退用 ease-out,一路减速,不回头。

       时长跟着画布走:620ms 是画布退到后面又走回前面的时间(stage.swap)。
       面板缩回那一格和画布走回前面是同一个动作的两半,不同速就不是一次交换,
       是两件事各走各的。透明度 420ms 先走完——那时形已经走了九成八,
       剩下那点尾巴本来就看不出动静。 */
    transition:opacity 420ms ease,transform 620ms var(--ease-out)}
  .picker.on .panel{opacity:1;transform:scale(1);pointer-events:auto;
    transition:opacity 220ms ease,transform 520ms var(--spring)}
  .panel:focus{outline:none}
  .panel-top{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;padding:0 3px}
  .panel-top h4{margin:0;font-size:14px;font-weight:550}
  .panel-top .why{flex:1;min-width:0;color:var(--ink-3);font-size:11.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .panel-close{flex:0 0 auto;border:0;background:none;color:var(--ink-3);font:inherit;font-size:12px;
    cursor:pointer;padding:0}
  .panel-close:hover{color:var(--ink)}
  .panel-sub{margin:0 0 13px;padding:0 3px;color:var(--ink-2);font-size:12.5px;line-height:1.55}
  .panel-lbl{margin:13px 3px 7px;color:var(--ink-3);font-size:11px;font-weight:500;letter-spacing:.04em}
  .panel-lbl:first-of-type{margin-top:0}
  .src-row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 14px;border:0;
    border-radius:16px;background:var(--surface);font:inherit;cursor:pointer;margin-bottom:7px;
    transition:background 160ms ease,box-shadow 160ms ease}
  .src-row:hover{background:#edeef1;box-shadow:0 0 0 1px rgba(20,26,38,.07)}
  .src-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .src-ico{width:30px;height:30px;flex:0 0 auto;display:grid;place-items:center;border-radius:10px;
    background:#fff;color:var(--ink-2);box-shadow:0 0 0 1px rgba(20,26,38,.06)}
  .src-ico svg{width:15px;height:15px}
  .src-main{flex:1;min-width:0;display:flex;flex-direction:column}
  .src-main b{font-size:13px;font-weight:550;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .src-main i{font-style:normal;font-size:11.5px;color:var(--ink-3)}
  .src-meta{flex:0 0 auto;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .src-actions{display:flex;gap:7px;margin-top:10px}
  .src-actions .src-row{flex:1;margin-bottom:0;justify-content:center}
  .src-row.drop{background:none;box-shadow:inset 0 0 0 1.5px #d7dbe1;
    transition:box-shadow 160ms ease,background 160ms ease}
  .src-row.drop .src-main{flex:0 0 auto}
  .src-row.drop .src-ico{box-shadow:0 0 0 1px rgba(20,26,38,.08)}
  .src-row.drop:hover{background:none;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 55%,#d7dbe1)}
  .panel-field{width:100%;padding:11px 14px;border:0;border-radius:16px;background:var(--surface);
    font:inherit;font-size:13px;color:var(--ink);outline:none;resize:none;
    box-shadow:inset 0 0 0 1px transparent;transition:box-shadow 140ms ease}
  .panel-field:focus{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 55%,#d7dbe1)}
  textarea.panel-field{font-family:var(--mono);font-size:12.5px;line-height:1.7;
    scrollbar-width:thin;scrollbar-color:rgba(20,26,38,.16) transparent}
  /* 编出来的东西必须自己说自己是编的,而且说在面上,不是藏在注释里。 */
  .panel-note{margin:14px 3px 0;padding-top:11px;border-top:1px solid var(--line);
    color:var(--ink-3);font-size:11px;line-height:1.6}

  .bar{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:50;
    width:min(680px,calc(100vw - 48px))}
  /* 输入框和按钮同高(32),贴着底对齐,四边就都是 8——差一像素整条就是歪的。
     字多了往上长,长到 7 行封顶再自己滚,不遮画布。 */
  .bar form{display:flex;align-items:flex-end;gap:10px;padding:8px 8px 8px 18px;border-radius:24px;
    background:var(--paper);box-shadow:0 8px 24px -10px rgba(20,26,38,.20),0 0 0 1px rgba(20,26,38,.06)}
  /* 高度不靠 JS 量。量出来的是某一刻的数,写死之后字体晚一步就位、窗口一变就不对了,
     而且错了是往大里错——一行字撑开好几行的空。
     改成一个隐形的替身跟输入框叠在同一格里:替身是普通文字,它多高这一格就多高,
     输入框跟着这一格。字体几时就位、窗口怎么变,都是浏览器自己重排。 */
  .grow{flex:1;min-width:0;display:grid}
  .grow::after{content:attr(data-value) " ";visibility:hidden;white-space:pre-wrap;word-break:break-word}
  /* box-sizing 要单独写:* 选择器不匹配伪元素,替身会比输入框高出一个 padding。
     封顶两边都要写:只封外面那层,输入框还是照长,长出去的部分被裁掉,光标就跑到看不见的地方。 */
  .grow > textarea,.grow::after{grid-area:1/1;box-sizing:border-box;min-height:32px;max-height:164px;
    padding:5px 0;border:0;margin:0;font:inherit;font-size:14.5px;line-height:22px;color:var(--ink)}
  .grow > textarea{outline:none;background:transparent;resize:none;overflow-y:auto}
  .bar textarea::placeholder{color:var(--ink-3)}
  /* 没字可发的时候按钮不该是一坨灰饼:只留一个箭头,有字了才实心。 */
  .bar button{width:32px;height:32px;flex:0 0 auto;display:grid;place-items:center;border:0;
    border-radius:50%;background:var(--accent);color:#fff;cursor:pointer;
    transition:background 160ms ease,color 160ms ease}
  .bar button svg{display:block}
  .bar button:hover{background:#2458c7}
  .bar button:disabled{background:transparent;color:#c2c7d0;cursor:default}
  /* 画布视图控制沿用纸面与细线图标，比例本身也是恢复入口。 */
  .canvas-controls{position:fixed;right:24px;bottom:32px;z-index:51;display:flex;align-items:center;gap:2px;
    padding:3px;border-radius:12px;background:var(--paper);color:var(--ink-2);
    box-shadow:0 4px 16px -8px rgba(20,26,38,.16),0 0 0 1px rgba(20,26,38,.05)}
  .canvas-controls button{display:grid;place-items:center;min-width:32px;height:32px;padding:0;border:0;border-radius:8px;
    background:transparent;color:inherit;font:inherit;font-size:11px;cursor:pointer;transition:background-color 140ms ease,color 140ms ease}
  .canvas-controls button:hover:not(:disabled){background:var(--surface);color:var(--ink)}
  .canvas-controls button:focus-visible{outline:2px solid var(--nc-focus);outline-offset:2px}
  .canvas-controls button:disabled{opacity:.3;cursor:default}
  .canvas-controls svg{width:16px;height:16px}
  .canvas-controls #zoom-reset{min-width:48px;font-variant-numeric:tabular-nums}
  .canvas-controls #zoom-fit{margin-left:4px;position:relative}
  .canvas-controls #zoom-fit::before{content:'';position:absolute;left:-3px;top:8px;bottom:8px;width:1px;background:var(--line)}
  @media(max-width:1100px){.canvas-controls{bottom:calc(var(--composer-height,48px) + 40px)}}
</style>
<link rel="stylesheet" href="./sessions.css">
<link rel="stylesheet" href="./theme.css">
</head>
<body>
  <header class="top">
    <div class="brand"><button id="sidebar-toggle" class="sidebar-toggle" aria-label="切换会话侧栏" aria-controls="sessions" aria-expanded="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2.5" y="3" width="15" height="14" rx="2"/><path d="M8 3v14"/></svg></button><span class="logo">
      <!-- 三张卡,越来越小、越来越淡:建好的、在建的、还没到的。
           从头到尾只有一种形——就是画布上那张卡。
           圆角比例比卡片大一倍(0.30 对 24/176):同一个形在这个尺度上要更软才看着一样,
           照搬 0.14 的话 10px 见方配 1.4px 圆角,圆角基本没了,是个直角块。 -->
      <svg viewBox="0 0 27.6 11" fill="currentColor" aria-hidden="true">
        <rect x="0" y="0.5" width="10" height="10" rx="3"/>
        <rect x="12.4" y="1.9" width="7.2" height="7.2" rx="2.16" opacity=".5"/>
        <rect x="22.4" y="2.9" width="5.2" height="5.2" rx="1.56" opacity=".24"/>
      </svg>
      <span class="logo-t"><b>Canvas</b>Flow</span>
    </span>
    </div>
  </header>
  <aside class="sessions" id="sessions" aria-label="会话管理">
    <div class="session-heading"><p class="session-label" id="session-list-title">工作流</p><button class="session-new" id="fresh" aria-label="新工作流" title="新工作流"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M10 4.5v11M4.5 10h11"/></svg></button></div>
    <nav class="session-list" id="session-list" aria-label="工作流会话"></nav>
    <p class="session-error" id="session-error" role="alert" hidden></p>
    <div class="session-footer"><span class="session-save" id="session-save" role="status">正在连接…</span><button class="session-trash" id="session-retry-save" hidden>重试保存</button><button class="session-trash" id="session-trash">已删除</button>
      <details class="session-settings" id="session-settings">
        <summary><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><path d="M3 6h6m4 0h4M3 14h2m4 0h8"/><circle cx="11" cy="6" r="2"/><circle cx="7" cy="14" r="2"/></svg><span>设置</span></summary>
        <div class="settings-panel"><fieldset><legend>外观</legend><div class="theme-options">
          <label class="theme-option"><input type="radio" name="theme" value="light"><span>浅色</span></label>
          <label class="theme-option"><input type="radio" name="theme" value="dark"><span>暗色</span></label>
        </div></fieldset></div>
      </details>
    </div>
  </aside>
  <dialog class="session-rename" id="session-rename" aria-labelledby="session-rename-title"><form><label for="session-name" id="session-rename-title">重命名工作流</label><input id="session-name" required maxlength="80" autocomplete="off" aria-describedby="session-name-error"><p id="session-name-error" role="alert" hidden></p><div class="dialog-actions"><button type="submit" value="cancel" formnovalidate>取消</button><button type="submit" value="save">保存</button></div></form></dialog>
  <div class="boot-notice" id="boot-notice" role="alert">请通过 <a href="http://127.0.0.1:5174/">工作流服务</a> 打开应用；源码文件不能直接发送或保存工作流。</div>
  <div class="stage" id="stage">
    <div class="viewport" id="viewport"><div class="world" id="world">
      <svg class="wires" id="wires"></svg>
    </div></div>
  </div>

  <div class="plan" id="plan" hidden>
    <span class="plan-label">需求</span>
    <p class="plan-text"></p>
    <div class="plan-body">
      <div class="plan-sec sec-understanding" hidden><p class="plan-h">理解</p>
        <table class="plan-table"><thead><tr><th>原文</th><th>解读</th></tr></thead><tbody></tbody></table></div>
      <div class="plan-sec sec-route" hidden><p class="plan-h">路线</p><div class="plan-route"></div></div>
      <div class="plan-sec sec-asks" hidden><p class="plan-h">待确认</p><div class="plan-asks"></div>
        <p class="plan-hint">答不上的说一声，先按最常见的口径搭。</p></div>
      <div class="plan-sec sec-chat" hidden><div class="plan-chat"></div></div>
    </div>
    <div class="plan-foot">
      <span class="plan-dot"></span>
      <span class="plan-say"></span>
      <button class="plan-go" hidden>开始生成</button>
      <button class="plan-close" hidden>收起</button>
    </div>
    <p class="plan-problems" id="plan-problems" hidden></p>
  </div>

  <div class="picker" id="picker" hidden><div class="panel" role="dialog" tabindex="-1"></div></div>

  <div class="bar">
    <form id="form">
      <div class="grow" id="grow" data-value=""><textarea id="input" rows="1" autocomplete="off"
        placeholder="描述你要做的数据处理" aria-label="描述你要做的数据处理"></textarea></div>
      <button id="send" type="submit" aria-label="发送" disabled>
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 12.8V3.9M8 3.9 4.1 7.8M8 3.9l3.9 3.9"
          fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
    <p class="bar-status" id="bar-status" role="status"></p>
  </div>

  <div class="canvas-controls" role="group" aria-label="画布缩放">
    <button id="zoom-out" type="button" aria-label="缩小画布" title="缩小"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M5 10h10"/></svg></button>
    <button id="zoom-reset" type="button" aria-label="恢复默认大小（100%）" title="恢复默认大小 · 100%">100%</button>
    <button id="zoom-in" type="button" aria-label="放大画布" title="放大"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M5 10h10M10 5v10"/></svg></button>
    <button id="zoom-fit" type="button" aria-label="适应画布" title="适应画布"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5H3.5V7M13 3.5h3.5V7M16.5 13v3.5H13M7 16.5H3.5V13"/></svg></button>
  </div>
  <script src="./bootstrap.js"></script>
</body>
</html>
