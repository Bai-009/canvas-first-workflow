<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>节点对话 · 手写预览</title>
<link rel="stylesheet" href="./node-conversation.css"><style>
:root{--paper:#fff;--canvas:#eef0f3;--surface:#f4f5f7;--line:#e4e6ea;--ink:#1a1d22;--ink-2:#545b65;--ink-3:#8f96a0;--accent:#2f6fed;--font:Inter,"PingFang SC",sans-serif;--mono:ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0;overflow-x:clip;background:var(--canvas);color:var(--ink);font-family:var(--font)}main{width:min(540px,calc(100% - 32px));margin:42px auto 80px}h1{font-size:19px;font-weight:550;margin:0 0 8px}header p{font-size:12px;color:var(--ink-2);line-height:1.7;margin:0}article{margin-top:30px}article>p{font-size:11px;color:var(--ink-2);margin:0 0 9px}.demo-card{padding:18px;background:var(--paper);border:1px solid var(--line);border-radius:22px}.demo-name{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:550;margin:0}.demo-name i{display:inline-grid;place-items:center;width:30px;height:30px;background:var(--surface);border-radius:9px;font-style:normal;color:var(--accent)}.demo-context{font-size:12px;color:var(--ink-2);line-height:1.6;margin:11px 0 0}
</style></head><body><main><header><h1>从节点开始，修改整条工作流</h1><p>手写交互预览。下面的内容和反馈用于检查组件，不连接模型，不修改工作流。</p></header><div id="states"></div></main><script type="module">
import {createNodeConversation} from './node-conversation.mjs';
const cases=[['default','默认'],['hover','悬停'],['focus','键盘聚焦'],['active','按下'],['disabled','等待其他操作'],['loading','修改中'],['error','修改未完成'],['success','修改完成']];
for(const [kind,label] of cases){const article=document.createElement('article');article.innerHTML=`<p>${label}</p><div class="demo-card"><h2 class="demo-name"><i aria-hidden="true">↳</i>解析合同文本</h2><p class="demo-context">Input · 合同文件<br>Output · Text · 按文件</p></div>`;document.getElementById('states').append(article);const node={name:'解析合同文本',step:'s2'};const c=createNodeConversation({node,onSend:async()=>{await new Promise(r=>setTimeout(r,500));c.update({edits:[{id:'demo',status:'unchanged',text:'预览提交',summary:'这是手写演示，没有修改真实工作流。',changes:[],review:[]}]});}});article.querySelector('.demo-card').append(c.el);const edits=kind==='loading'?[{id:'demo',status:'processing',text:'保留每份合同的来源，并让入库带上这个字段。'}]:kind==='error'?[{id:'demo',status:'failed',text:'保留每份合同的来源，并让入库带上这个字段。',error:'这次未能取得模型回复。你的修改文字还在，可以再次发送。'}]:kind==='success'?[{id:'demo',status:'applied',text:'保留每份合同的来源，并让入库带上这个字段。',summary:'解析结果保留了来源，后面的字段抽取和入库也一起带上。',changes:['解析合同文本','提取合同字段','写入合同表'],review:[{step:'s1',summary:'读取文件的方式保持不变。'},{step:'s2',summary:'解析结果增加来源信息。'},{step:'s3',summary:'字段抽取保留来源信息。'},{step:'s4',summary:'入库映射包含来源字段。'}]}]:[];c.update({edits,busy:kind==='disabled'||kind==='loading'});if(!['default','loading','success'].includes(kind)){const input=c.el.querySelector('textarea');input.value='保留每份合同的来源，并让入库带上这个字段。';input.dispatchEvent(new Event('input'));}if(['hover','focus','active'].includes(kind))c.el.querySelector(kind==='focus'?'textarea':'.nc-send').classList.add('is-'+kind);}
</script></body></html>
