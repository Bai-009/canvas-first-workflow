<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="960" viewBox="0 0 1520 960" role="img" aria-labelledby="title desc">
<title id="title">CanvasFlow architecture</title><desc id="desc">The browser canvas sends global and node-local requests to the state machine. The state machine assembles context for planning or execution agents. Each agent submits to a validator; rejected proposals return to the agent. Accepted results return to the state machine, which commits them and sends updates to the canvas. Session storage preserves committed state. Agents call an external model API; data processing nodes are not executed in this demo.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="#3872a5" stroke-width="1.3"/></marker><pattern id="paper" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="1" cy="2" r=".5" fill="#928b7e" opacity=".05"/><circle cx="6" cy="7" r=".4" fill="#fff" opacity=".65"/></pattern></defs>
