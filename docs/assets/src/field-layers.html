<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Field layers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --panel:#F0EEE8; --panel-text:#5F5E59; --ink:#1F1E1B; --gray:#6B6A63; --line:#8A8780;
    --shared-bg:#DCE6F7; --shared-st:#B3C5E6; --shared-tx:#2B4A7E;
    --two-bg:#DFEDD6;    --two-st:#B1CDA0;    --two-tx:#3A652A;
    --pres-bg:#FBE5D9;   --pres-st:#E9BBA4;   --pres-tx:#9A4A2B;
    --local-bg:#FFFFFF;  --local-st:#C4C2BB;  --local-tx:#5F5E59;
    --serif:"Source Serif 4","Noto Serif SC",Georgia,serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  }
  html,body { margin:0; background:#fff; }
  .fig { position:relative; width:1240px; height:664px; background:#fff; font-family:var(--serif); overflow:hidden; }
  svg { position:absolute; left:0; top:0; }
  text { font-family:var(--serif); }
  .t-h1 { font-size:24px; font-weight:600; fill:var(--ink); letter-spacing:.01em; }
  .t-panel { font-size:15px; font-weight:500; fill:var(--panel-text); letter-spacing:.01em; }
  .panel { fill:var(--panel); }
  .box { stroke-width:1.1; }
  .box.shared { fill:var(--shared-bg); stroke:var(--shared-st); }
  .box.two    { fill:var(--two-bg);    stroke:var(--two-st); }
  .box.pres   { fill:var(--pres-bg);   stroke:var(--pres-st); }
  .box.local  { fill:var(--local-bg);  stroke:var(--local-st); }
  .box.dashed { stroke-dasharray:5 4; }
  .t-title { font-size:16px; font-weight:600; }
  .t-title.shared { fill:var(--shared-tx); } .t-title.two { fill:var(--two-tx); }
  .t-title.pres { fill:var(--pres-tx); }     .t-title.local { fill:var(--local-tx); }
  .t-sub { font-size:12.5px; }
  .t-sub.shared { fill:var(--shared-tx); opacity:.82; } .t-sub.two { fill:var(--two-tx); opacity:.82; }
  .t-sub.pres { fill:var(--pres-tx); opacity:.82; }     .t-sub.local { fill:var(--local-tx); opacity:.9; }
  .mono { font-family:var(--mono); font-size:11px; }
  .mono.shared { fill:var(--shared-tx); } .mono.two { fill:var(--two-tx); }
  .mono.pres { fill:var(--pres-tx); }     .mono.local { fill:var(--local-tx); }
  .cost { font-size:11.5px; fill:var(--gray); }
  .arrow { fill:none; stroke:var(--line); stroke-width:1.1; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#ah); }
  .stem { fill:none; stroke:var(--line); stroke-width:1.1; stroke-linecap:round; stroke-linejoin:round; }
  .rule { font-size:13.5px; fill:var(--ink); }
  .rule tspan.k { font-family:var(--mono); font-size:12px; fill:var(--gray); }
</style></head>
<body>
<div class="fig">
  <svg width="1240" height="664" viewBox="0 0 1240 664">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1.5 1.8 L8.5 5 L1.5 8.2 Z" fill="#8A8780" stroke="#8A8780" stroke-width=".8" stroke-linejoin="round"/></marker>
    </defs>

    <text x="620" y="52" text-anchor="middle" class="t-h1">Field layers · where a name is defined, and who is bound by it</text>

    <!-- root -->
    <rect x="545" y="86" width="150" height="44" rx="12" class="panel"/>
    <text x="620" y="113.5" text-anchor="middle" class="t-panel" style="font-size:16px;font-weight:600">Field scope</text>

    <!-- stems -->
    <path class="stem" d="M620 130 L620 162"/>
    <path class="stem" d="M310 162 L1111 162"/>
    <path class="arrow" d="M310 162 L310 192"/>
    <path class="arrow" d="M693 162 L693 192"/>
    <path class="arrow" d="M904 162 L904 192"/>
    <path class="arrow" d="M1111 162 L1111 192"/>

    <!-- ── Shared ─────────────────────────────────────────── -->
    <rect x="40" y="196" width="540" height="252" rx="18" class="panel"/>
    <text x="310" y="230" text-anchor="middle" class="t-panel">Shared · plan agent, executor, state machine, front end</text>

    <rect x="56" y="252" width="250" height="172" rx="12" class="box shared"/>
    <text x="181" y="278" text-anchor="middle" class="t-title shared">Plan</text>
    <text x="72" y="308" class="mono shared">goal · readiness · revision</text>
    <text x="72" y="327" class="mono shared">understanding: quote · reading</text>
    <text x="72" y="346" class="mono shared">steps: ref · title · intent</text>
    <text x="90" y="365" class="mono shared">input · output · dependsOn</text>
    <text x="72" y="384" class="mono shared">openQuestions: ref · question</text>
    <text x="90" y="403" class="mono shared">reason · affects · options</text>

    <rect x="322" y="252" width="242" height="172" rx="12" class="box shared"/>
    <text x="443" y="278" text-anchor="middle" class="t-title shared">Canvas</text>
    <text x="338" y="308" class="mono shared">nodes: name · step · type</text>
    <text x="356" y="327" class="mono shared">params · blanks · note</text>
    <text x="338" y="346" class="mono shared">edges: from · to · output</text>
    <text x="338" y="365" class="mono shared">version</text>

    <text x="310" y="474" text-anchor="middle" class="cost">Renaming here moves all four sides at once</text>

    <!-- ── Two-party ──────────────────────────────────────── -->
    <rect x="600" y="196" width="186" height="228" rx="12" class="box two"/>
    <text x="693" y="224" text-anchor="middle" class="t-title two">Two-party</text>
    <text x="693" y="245" text-anchor="middle" class="t-sub two">state machine ↔ executor</text>
    <text x="616" y="280" class="mono two">kind: patch / covered</text>
    <text x="616" y="299" class="mono two">rejection reasons</text>
    <text x="616" y="318" class="mono two">rounds</text>
    <text x="693" y="398" text-anchor="middle" class="cost">canvas unaffected</text>

    <!-- ── Presentation ───────────────────────────────────── -->
    <rect x="806" y="196" width="196" height="228" rx="12" class="box pres dashed"/>
    <text x="904" y="224" text-anchor="middle" class="t-title pres">Presentation</text>
    <text x="904" y="245" text-anchor="middle" class="t-sub pres">translator → front end</text>
    <text x="822" y="280" class="mono pres">card kind · sentence</text>
    <text x="822" y="299" class="mono pres">slot · slot dictionary</text>
    <text x="822" y="318" class="mono pres">node table</text>
    <text x="904" y="398" text-anchor="middle" class="cost">contract untouched</text>

    <!-- ── Local ──────────────────────────────────────────── -->
    <rect x="1022" y="196" width="178" height="228" rx="12" class="box local"/>
    <text x="1111" y="224" text-anchor="middle" class="t-title local">Local</text>
    <text x="1111" y="245" text-anchor="middle" class="t-sub local">one place only</text>
    <text x="1038" y="280" class="mono local">transcript · events</text>
    <text x="1038" y="299" class="mono local">CSS constants</text>
    <text x="1111" y="398" text-anchor="middle" class="cost">change at will</text>

    <!-- ── Rules ──────────────────────────────────────────── -->
    <rect x="40" y="508" width="1160" height="116" rx="18" class="panel"/>
    <text x="72" y="542" class="t-panel">Rules</text>
    <text x="1168" y="542" text-anchor="end" class="cost">Dashed border — designed, not built</text>
    <text x="72"  y="574" class="rule">A field is defined at the outermost layer that needs it.</text>
    <text x="640" y="574" class="rule">No shadowing — one word, one meaning, in every layer.</text>
    <text x="72"  y="600" class="rule">A layer merely passing through never re-picks fields; only the owner checks them.</text>
    <text x="640" y="600" class="rule">Test — add a field to the contract, change no code in between, it reaches the canvas.</text>
  </svg>
</div>
</body></html>
