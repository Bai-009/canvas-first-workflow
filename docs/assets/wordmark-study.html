<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CanvasFlow — Type studies</title>
<style>
:root{--paper:#f8f7f3;--ink:#222624;--muted:#747871;--rule:#dfdfd8;--ui:-apple-system,BlinkMacSystemFont,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui)}main{max-width:1120px;margin:auto;padding:48px 6vw 34px}header{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:30px}section{padding:30px 0 38px;border-bottom:1px solid var(--rule)}.label{display:flex;gap:22px;font-size:12px;color:var(--muted);margin-bottom:16px}.letter{color:var(--ink);width:12px}.wordmark{display:flex;align-items:baseline;gap:34px;font-size:clamp(44px,8.2vw,104px);line-height:1.12;white-space:nowrap;font-weight:400}.serif{font-family:Baskerville,Georgia,serif;letter-spacing:-.025em}.humanist{font-family:Optima,Candara,sans-serif;letter-spacing:-.018em}.geometric{font-family:"Avenir Next",Avenir,sans-serif;letter-spacing:-.045em}.mark{display:flex;align-items:baseline;gap:8px}.mark i{display:block;width:19px;height:19px;border-radius:4px;background:var(--ink)}.mark i:nth-child(2){width:13px;height:13px;opacity:.55;border-radius:3px}.mark i:nth-child(3){width:9px;height:9px;opacity:.3;border-radius:2px}footer{font-size:11px;color:var(--muted);line-height:1.6;margin-top:26px;max-width:620px}@media(max-width:600px){main{padding:28px 22px}.wordmark{gap:17px;font-size:clamp(39px,10vw,60px)}.mark{gap:5px}.mark i{width:12px;height:12px;border-radius:3px}.mark i:nth-child(2){width:8px;height:8px}.mark i:nth-child(3){width:6px;height:6px}section{padding:28px 0}header{letter-spacing:.06em}}
</style>
<main>
<header><span>CanvasFlow</span><span>Type studies / 01</span></header>
<section><div class="label"><span class="letter">A</span><span>Editorial serif · Baskerville</span></div><div class="wordmark serif">CanvasFlow<span class="mark" aria-hidden="true"><i></i><i></i><i></i></span></div></section>
<section><div class="label"><span class="letter">B</span><span>Humanist · Optima</span></div><div class="wordmark humanist">CanvasFlow<span class="mark" aria-hidden="true"><i></i><i></i><i></i></span></div></section>
<section><div class="label"><span class="letter">C</span><span>Geometric · Avenir Next</span></div><div class="wordmark geometric">CanvasFlow<span class="mark" aria-hidden="true"><i></i><i></i><i></i></span></div></section>
<footer>Live type, rendered with locally installed fonts. These are directions for review, not a finished identity. No font files are bundled.</footer>
</main>
</html>
