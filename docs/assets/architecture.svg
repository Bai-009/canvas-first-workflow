<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 552" width="1000" height="552" role="img" aria-labelledby="t d">
  <title id="t">Canvas-first Workflow 架构总览</title>
  <desc id="d">上半是做出来的设计者一段：用户一句话进 Plan Agent，经 propose_plan 提交，Gate 放行后成为一份方案，用户核对后补一句，整份重出。下半是设计稿的执行者一段：状态机一次交一步给 Execution Agent，画布改动过画布 Gate 后，画布长出一段。</desc>
  <style>
    .f { font-family: Inter, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", -apple-system, "Segoe UI", sans-serif; }
    .m { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .ink { fill: #1a1d22; }
    .dim { fill: #5c6270; }
    .mute { fill: #8a9099; }
    .acc { fill: #2f6fed; }
    .box { fill: #fff; stroke: #1a1d22; stroke-width: 1.2; }
    .box-draft { fill: #fff; stroke: #8a9099; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .line { fill: none; stroke: #1a1d22; stroke-width: 1.2; }
    .line-draft { fill: none; stroke: #8a9099; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .t15 { font-size: 15px; font-weight: 600; }
    .t14 { font-size: 14px; font-weight: 600; }
    .t13 { font-size: 13px; font-weight: 600; }
    .t12 { font-size: 12px; }
    .t11 { font-size: 11.5px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a1d22"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a9099"/></marker>
  </defs>

  <rect width="1000" height="552" rx="16" fill="#fff" stroke="#e4e6ea"/>

  <!-- 设计者这一半：已做 -->
  <rect x="24" y="40" width="952" height="282" rx="14" fill="#f4f5f7"/>
  <text x="40" y="64" class="f t13 ink">设计者这一半 · 做出来了，在真模型上验过</text>

  <!-- 用户核对后补一句：整份重出 -->
  <path d="M820 104 V84 H112 V138" class="line" marker-end="url(#a)"/>
  <text x="600" y="78" text-anchor="middle" class="f t11 dim">核对后补一句 → 整份重出，编号相同就原地改</text>

  <!-- 用户 -->
  <rect x="48" y="138" width="128" height="64" rx="12" class="box"/>
  <path d="M64 202 L58 216 L80 202" class="box"/>
  <line x1="65" y1="202" x2="79" y2="202" stroke="#fff" stroke-width="2.5"/>
  <text x="112" y="167" text-anchor="middle" class="f t14 ink">用户</text>
  <text x="112" y="186" text-anchor="middle" class="f t11 dim">一句话说要做什么</text>

  <path d="M176 170 H250" class="line" marker-end="url(#a)"/>
  <text x="213" y="162" text-anchor="middle" class="f t11 dim">说一句</text>

  <!-- Plan Agent -->
  <rect x="250" y="134" width="160" height="72" rx="12" class="box"/>
  <text x="330" y="165" text-anchor="middle" class="f t14 ink">Plan Agent</text>
  <text x="330" y="186" text-anchor="middle" class="f t11 dim">判形态，推链路，问该问的</text>

  <path d="M410 170 H500" class="line" marker-end="url(#a)"/>
  <text x="455" y="162" text-anchor="middle" class="m t11 dim">propose_plan</text>

  <!-- Gate -->
  <rect x="500" y="134" width="120" height="72" rx="12" class="box" stroke-width="2"/>
  <text x="560" y="165" text-anchor="middle" class="f t14 ink">Gate</text>
  <text x="560" y="186" text-anchor="middle" class="f t11 dim">schema + 跨字段</text>

  <path d="M620 170 H690" class="line" marker-end="url(#a)"/>
  <text x="655" y="162" text-anchor="middle" class="f t11 dim">放行</text>

  <!-- 一份方案 -->
  <rect x="690" y="104" width="260" height="196" rx="12" class="box"/>
  <text x="706" y="131" class="f t14 ink">一份方案</text>
  <rect x="882" y="116" width="52" height="20" rx="10" fill="#f4f5f7"/>
  <text x="908" y="130" text-anchor="middle" class="m t11 dim">partial</text>
  <line x1="690" y1="146" x2="950" y2="146" stroke="#e4e6ea"/>

  <text x="706" y="172" class="f t12 dim">理解</text>
  <text x="756" y="172" class="m t12 acc">u1  u2  u3  u4</text>
  <text x="756" y="190" class="f t11 mute">原话 → 读成了什么</text>

  <text x="706" y="220" class="f t12 dim">路线</text>
  <text x="756" y="220" class="m t12 acc">s1 → s2 → s3 → s4</text>
  <text x="756" y="238" class="f t11 mute">进来什么形态，出去什么形态</text>

  <text x="706" y="268" class="f t12 dim">待确认</text>
  <text x="756" y="268" class="m t12 acc">q1  q2  q3  q4</text>
  <text x="756" y="286" class="f t11 mute">错了看不出来的才问</text>

  <!-- 两条回路 -->
  <path d="M560 206 V240 H390 V206" class="line" marker-end="url(#a)"/>
  <text x="475" y="256" text-anchor="middle" class="f t11 dim">没过：错误发回，重交整份</text>

  <path d="M270 206 V240 H112 V202" class="line" marker-end="url(#a)"/>
  <text x="191" y="256" text-anchor="middle" class="f t11 dim">信息不够：只问，不提交</text>

  <!-- 权威方案交给状态机 -->
  <path d="M820 300 V408" class="line-draft" marker-end="url(#ad)"/>
  <text x="830" y="358" class="f t11 mute">权威方案</text>

  <!-- 执行者退回重规划 -->
  <path d="M490 408 V380 H310 V206" class="line-draft" marker-end="url(#ad)"/>
  <text x="320" y="306" class="t11 mute"><tspan class="m">replan_required</tspan><tspan class="f"> · 走不通就退回重规划</tspan></text>

  <!-- 执行者这一半：设计稿 -->
  <rect x="24" y="344" width="952" height="160" rx="14" fill="none" stroke="#c9cdd3" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="40" y="368" class="f t13 mute">执行者这一半 · 设计稿，还没做</text>

  <rect x="750" y="408" width="140" height="64" rx="12" class="box-draft"/>
  <text x="820" y="435" text-anchor="middle" class="f t14 dim">状态机</text>
  <text x="820" y="455" text-anchor="middle" class="f t11 mute">一次交一步</text>

  <path d="M750 440 H650" class="line-draft" marker-end="url(#ad)"/>
  <text x="700" y="432" text-anchor="middle" class="f t11 mute">当前这一步</text>

  <rect x="470" y="408" width="180" height="64" rx="12" class="box-draft"/>
  <text x="560" y="435" text-anchor="middle" class="f t14 dim">Execution Agent</text>
  <text x="560" y="455" text-anchor="middle" class="f t11 mute">真实能力 → 画布改动</text>

  <path d="M470 440 H380" class="line-draft" marker-end="url(#ad)"/>
  <text x="425" y="432" text-anchor="middle" class="m t11 mute">graph_patch</text>

  <rect x="268" y="408" width="112" height="64" rx="12" class="box-draft"/>
  <text x="324" y="435" text-anchor="middle" class="f t14 dim">画布 Gate</text>
  <text x="324" y="455" text-anchor="middle" class="f t11 mute">节点、参数、连线</text>

  <path d="M268 440 H176" class="line-draft" marker-end="url(#ad)"/>
  <text x="222" y="432" text-anchor="middle" class="f t11 mute">放行，原子提交</text>

  <!-- 画布：一段一段长 -->
  <rect x="48" y="400" width="128" height="80" rx="12" class="box-draft"/>
  <text x="112" y="421" text-anchor="middle" class="f t12 mute">画布</text>
  <rect x="58" y="444" width="18" height="16" rx="4" fill="#8a9099"/>
  <line x1="76" y1="452" x2="88" y2="452" stroke="#8a9099" stroke-width="1.2"/>
  <rect x="88" y="444" width="18" height="16" rx="4" fill="#8a9099" opacity=".8"/>
  <line x1="106" y1="452" x2="118" y2="452" stroke="#8a9099" stroke-width="1.2" opacity=".8"/>
  <rect x="118" y="444" width="18" height="16" rx="4" fill="#8a9099" opacity=".55"/>
  <line x1="136" y1="452" x2="148" y2="452" stroke="#8a9099" stroke-width="1.2" opacity=".55"/>
  <rect x="148" y="444" width="18" height="16" rx="4" fill="#8a9099" opacity=".3"/>

  <!-- 图例 -->
  <text x="40" y="532" class="f t11 mute">实线：做出来了，真模型验过　　虚线：设计稿　　<tspan class="m acc">u s q</tspan>：编号，用户指认的坐标，也是界面算增量的依据</text>
</svg>
